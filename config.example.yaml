# 新人价自动化工具配置
source_file: D:\your_path\source.csv
output_root: D:\your_path\新人价自动化工具\data\output
date_tag: 20260727

sku_column: SKU(含影)
product_name_column: sku名称
mapping_column: 1自营3POP_映射
shop_column: 店铺名称
department_column: 1级部门名称（类目运营）
category2_column: 商品二级分类名称
erp_column: 销售员ERP帐号

keep_mapping_values:
  - 自营
keep_pop_shop_keyword: 京喜
exclude_category2:
  - 健康服务套餐
  - 其他服务
  - 特殊商品
exclude_name_keywords:
  - 非卖品
  - 赠品
exclude_erp_accounts:
  - zhaodong.103
target_departments:
  - 医药
  - 营养保健
  - 医疗器械
  - 消费器械
metric_sum_columns:
  - 去重计数_用户PIN加密
  - 求和_成交金额
  - 去重计数_销售订单编号
  - 求和_销售数量

current_success_skus_file:
submitted_skus_file:
strict_field_validation: true
export_csv: false
export_removed_details: false
debug_mode: false

split_base_name: 8月第一批查价前sku
split_chunk_size: 5000
split_source_sheet: 汇总
split_source_column: sku

backend_url: https://yx.jd.com/user-operate#/customize/findLowestActivity?pathkey=goodspool
backend_profile_dir: D:\your_path\新人价自动化工具\browser_profiles\backend
backend_wait_after_query: 45
backend_wait_after_export: 10
backend_only_file: 8月第一批查价前sku_PART01.xlsx
outlook_url: https://outlook.office.com/mail/
outlook_profile_dir: D:\your_path\新人价自动化工具\browser_profiles\outlook
outlook_search: 查价 新人价
outlook_max_mails: 20

# 最终整合模块；为空时自动使用最新筛品结果和查价结果导出目录
final_filter_file:
final_price_dir:
final_price_pattern: *.xlsx
final_price_sku_column: skuId
final_price_value_column: 100天最低价
final_price_date_label:

# 新人价提报安全测试模块；默认 dry_run 不上传不提交
registration_input_dir: D:\your_path\新人价自动化工具\data\input\提报确认表
registration_submit_dir: D:\your_path\新人价自动化工具\data\output\提报文件
